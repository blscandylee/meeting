<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>会议任务系统</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a73e8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="任务系统">
    <link rel="apple-touch-icon" href="icon.svg">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f0f2f5;
            color: #333;
            padding: 20px;
        }
        .container { max-width: 1100px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 8px; color: #1a73e8; }
        .subtitle { text-align: center; color: #888; margin-bottom: 25px; font-size: 14px; }

        .card {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }
        .card h2 { font-size: 17px; margin-bottom: 15px; color: #333; }

        .form-row { display: flex; gap: 14px; flex-wrap: wrap; }
        .form-group { margin-bottom: 14px; flex: 1; min-width: 150px; }
        .form-group.full { flex: 1 1 100%; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #555; font-size: 13px; }
        input, textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }
        textarea { resize: vertical; min-height: 70px; }
        input:focus, textarea:focus, select:focus {
            outline: none; border-color: #1a73e8;
            box-shadow: 0 0 0 3px rgba(26,115,232,0.15);
        }

        .btn {
            padding: 10px 20px; border: none; border-radius: 6px;
            cursor: pointer; font-size: 14px; font-weight: 600;
            transition: all 0.2s; display: inline-flex; align-items: center; gap: 5px;
        }
        .btn-primary { background: #1a73e8; color: #fff; }
        .btn-primary:hover { background: #1557b0; }
        .btn-green { background: #25d366; color: #fff; }
        .btn-green:hover { background: #1da851; }
        .btn-orange { background: #f39c12; color: #fff; }
        .btn-orange:hover { background: #d68910; }
        .btn-purple { background: #8e44ad; color: #fff; }
        .btn-purple:hover { background: #7d3c98; }
        .btn-red { background: #e74c3c; color: #fff; }
        .btn-red:hover { background: #c0392b; }
        .btn-gray { background: #95a5a6; color: #fff; }
        .btn-sm { padding: 5px 10px; font-size: 12px; }

        .stats { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
        .stat {
            flex: 1; min-width: 110px; padding: 12px;
            border-radius: 8px; text-align: center;
        }
        .stat .num { font-size: 26px; font-weight: 700; }
        .stat .lbl { font-size: 12px; color: #666; margin-top: 3px; }

        .filter-bar { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
        .filter-bar select { width: auto; padding: 7px 10px; font-size: 13px; }

        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 11px 10px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; font-weight: 700; color: #555; font-size: 13px; }
        tr:hover { background: #fafbfc; }
        tr.done-row { opacity: 0.55; }
        tr.done-row td { text-decoration: none; }

        .badge {
            display: inline-block; padding: 3px 10px;
            border-radius: 12px; font-size: 11px; font-weight: 700; color: #fff;
        }
        .b-pending { background: #f39c12; }
        .b-done { background: #2ecc71; }
        .b-overdue { background: #e74c3c; }
        .b-soon { background: #e67e22; }

        .date-red { color: #e74c3c; font-weight: 700; }
        .date-orange { color: #e67e22; font-weight: 700; }

        .actions { display: flex; gap: 5px; flex-wrap: wrap; }
        .cb { width: 22px; height: 22px; cursor: pointer; accent-color: #2ecc71; }

        .empty { text-align: center; padding: 40px; color: #999; }

        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.5);
            z-index: 1000; justify-content: center; align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: #fff; padding: 25px; border-radius: 12px;
            width: 92%; max-width: 520px; max-height: 90vh; overflow-y: auto;
        }
        .modal h2 { margin-bottom: 16px; }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }

        .toast {
            position: fixed; top: 20px; right: 20px; z-index: 2000;
            background: #2ecc71; color: #fff; padding: 14px 20px;
            border-radius: 8px; font-weight: 600; box-shadow: 0 4px 16px rgba(0,0,0,0.2);
            display: none; max-width: 340px;
        }
        .toast.show { display: block; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        .wa-link {
            background: #25d366; color: #fff; text-decoration: none;
            padding: 5px 10px; border-radius: 5px; font-size: 12px; font-weight: 600;
            display: inline-flex; align-items: center; gap: 3px;
        }
        .wa-link:hover { background: #1da851; }

        .sync-bar {
            background: #eef6ff; border: 1px solid #d0e4ff; color: #1a73e8;
            padding: 8px 14px; border-radius: 8px; font-size: 13px;
            margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
        }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #2ecc71; display: inline-block; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 会议任务系统</h1>
        <p class="subtitle">会议派任务 · WhatsApp 通知 · 完成追踪</p>

        <div class="sync-bar"><span class="dot"></span> 已连接云端 · 所有打开此链接的人看到同一份任务</div>

        <div class="card">
            <h2>➕ 派新任务</h2>
            <form id="taskForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="assignee">派给谁 *</label>
                        <input type="text" id="assignee" list="assigneeList" placeholder="负责人姓名" required>
                        <datalist id="assigneeList"></datalist>
                    </div>
                    <div class="form-group">
                        <label for="assigneePhone">对方电话</label>
                        <input type="tel" id="assigneePhone" placeholder="如: 60123456789">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group full">
                        <label for="taskDesc">什么任务 *</label>
                        <textarea id="taskDesc" placeholder="描述任务内容..." required></textarea>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="assignedTime">几时派（派发时间）*</label>
                        <input type="datetime-local" id="assignedTime" required>
                    </div>
                    <div class="form-group">
                        <label for="dueDate">Due Date *</label>
                        <input type="datetime-local" id="dueDate" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">派发任务</button>
            </form>
        </div>

        <div class="card">
            <h2>📊 任务总览</h2>
            <div class="stats" id="stats"></div>

            <div class="filter-bar">
                <input type="text" id="searchInput" placeholder="🔍 搜索任务、负责人..." style="width:auto;min-width:200px;">
                <select id="filterStatus">
                    <option value="">全部状态</option>
                    <option value="pending">待完成</option>
                    <option value="done">已完成</option>
                    <option value="overdue">已逾期</option>
                </select>
                <select id="filterAssignee"><option value="">全部负责人</option></select>
                <button class="btn btn-sm btn-green" id="toggleDoneBtn" style="margin-left:auto;">隐藏已完成</button>
            </div>

            <div style="overflow-x:auto;">
                <table id="taskTable">
                    <thead>
                        <tr>
                            <th style="width:40px;">✓</th>
                            <th>什么任务</th>
                            <th>派给谁</th>
                            <th>几时派</th>
                            <th>Due Date</th>
                            <th>状态</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="taskTableBody"></tbody>
                </table>
            </div>
            <div id="emptyState"></div>
        </div>
    </div>

    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <h2>✏️ 编辑任务</h2>
            <form id="editForm">
                <input type="hidden" id="editId">
                <div class="form-row">
                    <div class="form-group">
                        <label for="editAssignee">派给谁 *</label>
                        <input type="text" id="editAssignee" list="editAssigneeList" required>
                        <datalist id="editAssigneeList"></datalist>
                    </div>
                    <div class="form-group">
                        <label for="editPhone">对方电话</label>
                        <input type="tel" id="editPhone">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group full">
                        <label for="editDesc">什么任务 *</label>
                        <textarea id="editDesc" required></textarea>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="editAssignedTime">几时派 *</label>
                        <input type="datetime-local" id="editAssignedTime" required>
                    </div>
                    <div class="form-group">
                        <label for="editDueDate">Due Date *</label>
                        <input type="datetime-local" id="editDueDate" required>
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn" style="background:#ddd;" onclick="closeModal()">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <h2>⚙️ 设置 - 通知电话</h2>
            <div class="form-row">
                <div class="form-group full">
                    <label>完成任务时通知这些号码（每行一个）</label>
                    <textarea id="bossPhone" rows="4" placeholder="60123456789&#10;60987654321"></textarea>
                </div>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn" style="background:#ddd;" onclick="closeSettings()">取消</button>
                <button type="button" class="btn btn-primary" onclick="saveSettings()">保存</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const DB_URL = 'https://kepong-project-default-rtdb.firebaseio.com';
        let tasks = [];
        let phonebook = [];
        let settings = { bossPhones: [] };
        let editingId = null;
        let showCompleted = true;
        let knownDone = {};

        // ---------- 云端读写 ----------
        async function loadTasks() {
            try {
                const res = await fetch(`${DB_URL}/meeting_tasks.json`);
                const data = await res.json();
                tasks = data ? Object.entries(data).map(([id, t]) => ({ id, ...t })) : [];
            } catch (e) {
                console.error('加载任务失败:', e);
                tasks = [];
            }
        }

        async function saveTaskOne(id) {
            const t = tasks.find(x => x.id === id);
            if (!t) return;
            try {
                await fetch(`${DB_URL}/meeting_tasks/${id}.json`, { method: 'PUT', body: JSON.stringify(t) });
            } catch (e) { console.error('保存失败:', e); }
        }

        async function deleteTaskOne(id) {
            try {
                await fetch(`${DB_URL}/meeting_tasks/${id}.json`, { method: 'DELETE' });
            } catch (e) { console.error('删除失败:', e); }
        }

        async function loadSettings() {
            try {
                const res = await fetch(`${DB_URL}/meeting_settings.json`);
                const data = await res.json();
                if (data) settings = { ...settings, ...data };
                if (settings.bossPhone && !settings.bossPhones) {
                    settings.bossPhones = [settings.bossPhone];
                }
                document.getElementById('bossPhone').value = (settings.bossPhones || []).join('\n');
            } catch (e) { console.error('加载设置失败:', e); }
        }

        async function loadPhonebook() {
            try {
                const res = await fetch(`${DB_URL}/meeting_phonebook.json`);
                const data = await res.json();
                phonebook = data ? Object.values(data) : [];
            } catch (e) { phonebook = []; }
        }

        async function savePhonebook() {
            const obj = {};
            phonebook.forEach((p, i) => { obj['p' + i] = p; });
            try {
                await fetch(`${DB_URL}/meeting_phonebook.json`, { method: 'PUT', body: JSON.stringify(obj) });
            } catch (e) { console.error('保存电话簿失败:', e); }
        }

        function rememberPhone(name, phone) {
            if (!name || !phone) return;
            const existing = phonebook.find(p => p.name === name);
            if (existing) {
                if (existing.phone !== phone) {
                    existing.phone = phone;
                    savePhonebook();
                }
            } else {
                phonebook.push({ name, phone });
                savePhonebook();
            }
        }

        function lookupPhone(name) {
            const p = phonebook.find(x => x.name === name);
            return p ? p.phone : '';
        }

        async function saveSettings() {
            const raw = document.getElementById('bossPhone').value.trim();
            settings.bossPhones = raw ? raw.split('\n').map(s => s.trim()).filter(Boolean) : [];
            delete settings.bossPhone;
            try {
                await fetch(`${DB_URL}/meeting_settings.json`, { method: 'PUT', body: JSON.stringify(settings) });
            } catch (e) { console.error('保存设置失败:', e); }
            closeSettings();
            showToast('设置已保存');
        }

        // ---------- 工具 ----------
        function genId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2, 9);
        }

        function esc(s) {
            if (!s) return '';
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        function fmt(dt) {
            if (!dt) return '';
            return new Date(dt).toLocaleString('zh-CN', {
                year:'numeric', month:'2-digit', day:'2-digit',
                hour:'2-digit', minute:'2-digit', hour12:false
            });
        }

        function isOverdue(t) {
            if (t.done || !t.dueDate) return false;
            return new Date(t.dueDate) < new Date();
        }

        function isSoon(t) {
            if (t.done || !t.dueDate) return false;
            const diff = new Date(t.dueDate) - new Date();
            return diff > 0 && diff <= 86400000;
        }

        function statusOf(t) {
            if (t.done) return 'done';
            if (isOverdue(t)) return 'overdue';
            if (isSoon(t)) return 'soon';
            return 'pending';
        }

        function normPhone(p) {
            if (!p) return '';
            let c = p.replace(/[\s\-().]/g, '');
            if (c.startsWith('+')) c = c.substring(1);
            if (c.startsWith('00')) c = c.substring(2);
            if (c.startsWith('60')) return c;
            if (c.startsWith('0')) c = '6' + c;
            if (/^\d{8,9}$/.test(c)) c = '60' + c;
            return c;
        }

        function taskMsg(t, type) {
            if (type === 'send') {
                return `新任务派发\n\n内容: ${t.taskDesc}\n派给: ${t.assignee}\n派发时间: ${fmt(t.assignedTime)}\nDue: ${fmt(t.dueDate)}\n\n请尽快完成，谢谢！`;
            }
            if (type === 'remind') {
                return `任务提醒\n\n内容: ${t.taskDesc}\nDue: ${fmt(t.dueDate)}\n\n记得尽快完成哦！`;
            }
            if (type === 'complete') {
                return `任务已完成通知\n\n内容: ${t.taskDesc}\n负责人: ${t.assignee}\n完成时间: ${fmt(new Date().toISOString())}\n原定 Due: ${fmt(t.dueDate)}`;
            }
            return '';
        }

        function openWhatsApp(phone, msg) {
            const p = normPhone(phone);
            if (!p) { alert('请先填写电话号码'); return false; }
            const encoded = encodeURIComponent(msg);
            const url = `https://web.whatsapp.com/send?phone=${p}&text=${encoded}`;
            const a = document.createElement('a');
            a.href = url;
            a.target = '_blank';
            a.rel = 'noopener';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            return true;
        }

        function showToast(html) {
            const el = document.getElementById('toast');
            el.innerHTML = html;
            el.classList.add('show');
            clearTimeout(el._t);
            el._t = setTimeout(() => el.classList.remove('show'), 5000);
        }

        // ---------- 渲染 ----------
        function renderStats() {
            const total = tasks.length;
            const pending = tasks.filter(t => statusOf(t) === 'pending' || statusOf(t) === 'soon').length;
            const done = tasks.filter(t => t.done).length;
            const overdue = tasks.filter(t => isOverdue(t)).length;
            document.getElementById('stats').innerHTML = `
                <div class="stat" style="background:#eef6ff;"><div class="num" style="color:#1a73e8;">${total}</div><div class="lbl">全部任务</div></div>
                <div class="stat" style="background:#fff8e6;"><div class="num" style="color:#f39c12;">${pending}</div><div class="lbl">待完成</div></div>
                <div class="stat" style="background:#fdecea;"><div class="num" style="color:#e74c3c;">${overdue}</div><div class="lbl">已逾期</div></div>
                <div class="stat" style="background:#eafaf1;"><div class="num" style="color:#2ecc71;">${done}</div><div class="lbl">已完成</div></div>`;
        }

        function renderAssigneeFilter() {
            const sel = document.getElementById('filterAssignee');
            const cur = sel.value;
            const list = [...new Set(tasks.map(t => t.assignee).filter(Boolean))];
            sel.innerHTML = '<option value="">全部负责人</option>' + list.map(a => `<option value="${esc(a)}">${esc(a)}</option>`).join('');
            sel.value = cur;
        }

        function renderDatalist() {
            const names = [...new Set([
                ...tasks.map(t => t.assignee).filter(Boolean),
                ...phonebook.map(p => p.name).filter(Boolean)
            ])];
            const html = names.map(a => `<option value="${esc(a)}">`).join('');
            document.getElementById('assigneeList').innerHTML = html;
            document.getElementById('editAssigneeList').innerHTML = html;
        }

        function renderTasks() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const fs = document.getElementById('filterStatus').value;
            const fa = document.getElementById('filterAssignee').value;

            let list = tasks.slice().sort((a, b) => {
                if (a.done !== b.done) return a.done ? 1 : -1;
                return new Date(a.dueDate) - new Date(b.dueDate);
            });
            if (q) list = list.filter(t =>
                (t.taskName || '').toLowerCase().includes(q) ||
                (t.taskDesc || '').toLowerCase().includes(q) ||
                (t.assignee || '').toLowerCase().includes(q));
            if (fs) list = list.filter(t => statusOf(t) === fs || (fs === 'pending' && statusOf(t) === 'soon'));
            if (fa) list = list.filter(t => t.assignee === fa);
            if (!showCompleted) list = list.filter(t => !t.done);

            const tb = document.getElementById('taskTableBody');
            const empty = document.getElementById('emptyState');

            if (!list.length) {
                tb.innerHTML = '';
                document.getElementById('taskTable').style.display = 'none';
                empty.innerHTML = '<div class="empty">暂无任务记录</div>';
                return;
            }
            document.getElementById('taskTable').style.display = 'table';
            empty.innerHTML = '';

            tb.innerHTML = list.map(t => {
                const st = statusOf(t);
                const badge = st === 'done' ? '<span class="badge b-done">已完成</span>'
                    : st === 'overdue' ? '<span class="badge b-overdue">已逾期</span>'
                    : st === 'soon' ? '<span class="badge b-soon">即将到期</span>'
                    : '<span class="badge b-pending">待完成</span>';
                const dCls = st === 'overdue' ? 'date-red' : st === 'soon' ? 'date-orange' : '';
                const canWA = t.assigneePhone;
                return `
                <tr class="${t.done ? 'done-row' : ''}">
                    <td style="text-align:center;">
                        <input type="checkbox" class="cb" ${t.done ? 'checked' : ''} onchange="toggleDone('${t.id}', this.checked)">
                    </td>
                    <td><strong>${esc(t.taskDesc)}</strong></td>
                    <td>${esc(t.assignee)}</td>
                    <td style="white-space:nowrap;">${fmt(t.assignedTime)}</td>
                    <td class="${dCls}" style="white-space:nowrap;">${fmt(t.dueDate)}</td>
                    <td>${badge}</td>
                    <td>
                        <div class="actions">
                            ${canWA ? `<a href="#" class="wa-link" onclick="waSend('${t.id}');return false;">📤 派发</a>` : ''}
                            ${canWA ? `<a href="#" class="btn btn-sm btn-orange" onclick="waRemind('${t.id}');return false;">⏰ 提醒</a>` : ''}
                            <button class="btn btn-sm btn-purple" onclick="openEdit('${t.id}')">✏️</button>
                            <button class="btn btn-sm btn-red" onclick="delTask('${t.id}')">🗑</button>
                        </div>
                    </td>
                </tr>`;
            }).join('');
        }

        function refresh() {
            renderStats();
            renderAssigneeFilter();
            renderDatalist();
            renderTasks();
        }

        // ---------- 操作 ----------
        async function addTask(e) {
            e.preventDefault();
            const t = {
                id: genId(),
                taskDesc: document.getElementById('taskDesc').value.trim(),
                assignee: document.getElementById('assignee').value.trim(),
                assigneePhone: document.getElementById('assigneePhone').value.trim(),
                assignedTime: document.getElementById('assignedTime').value,
                dueDate: document.getElementById('dueDate').value,
                done: false,
                completedAt: '',
                createdAt: new Date().toISOString()
            };
            if (!t.taskDesc || !t.assignee || !t.assignedTime || !t.dueDate) return;
            rememberPhone(t.assignee, t.assigneePhone);
            tasks.push(t);
            await saveTaskOne(t.id);
            refresh();
            e.target.reset();
            showToast('✅ 任务已派发，可点「派发」按钮发 WhatsApp');
        }

        async function toggleDone(id, checked) {
            const t = tasks.find(x => x.id === id);
            if (!t) return;
            t.done = checked;
            t.completedAt = checked ? new Date().toISOString() : '';
            await saveTaskOne(id);
            refresh();
            if (checked) {
                const msg = taskMsg(t, 'complete');
                showToast(`✅ ${esc(t.assignee)} 完成了任务`);

                // ntfy.sh 手机推播（免费）
                const ntfyTopic = 'kepong-tasks';
                fetch(`https://ntfy.sh/${ntfyTopic}`, {
                    method: 'POST',
                    body: `${t.assignee} completed: ${t.taskDesc}`,
                    headers: { 'Title': 'Task Done', 'Priority': 'high' }
                }).then(r => {
                    if (!r.ok) showToast('推播发送失败: ' + r.status);
                }).catch(e => {
                    showToast('推播错误: ' + e.message);
                });

                if (settings.bossPhones && settings.bossPhones.length > 0) {
                    settings.bossPhones.forEach((phone, i) => {
                        setTimeout(() => openWhatsApp(phone, msg), 400 + i * 1500);
                    });
                } else {
                    navigator.clipboard.writeText(msg).catch(() => {});
                    showToast('✅ 已完成！通知已推播到手机');
                }
            }
        }

        async function delTask(id) {
            if (!confirm('确定要删除这个任务吗？')) return;
            tasks = tasks.filter(t => t.id !== id);
            await deleteTaskOne(id);
            refresh();
        }

        function waSend(id) {
            const t = tasks.find(x => x.id === id);
            if (t) openWhatsApp(t.assigneePhone, taskMsg(t, 'send'));
        }

        function waRemind(id) {
            const t = tasks.find(x => x.id === id);
            if (t) openWhatsApp(t.assigneePhone, taskMsg(t, 'remind'));
        }

        function openEdit(id) {
            const t = tasks.find(x => x.id === id);
            if (!t) return;
            editingId = id;
            document.getElementById('editId').value = t.id;
            document.getElementById('editDesc').value = t.taskDesc;
            document.getElementById('editAssignee').value = t.assignee;
            document.getElementById('editPhone').value = t.assigneePhone || '';
            document.getElementById('editAssignedTime').value = t.assignedTime || '';
            document.getElementById('editDueDate').value = t.dueDate || '';
            document.getElementById('editModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('editModal').classList.remove('active');
            editingId = null;
        }

        async function saveEdit(e) {
            e.preventDefault();
            const t = tasks.find(x => x.id === editingId);
            if (!t) return;
            t.taskDesc = document.getElementById('editDesc').value.trim();
            t.assignee = document.getElementById('editAssignee').value.trim();
            t.assigneePhone = document.getElementById('editPhone').value.trim();
            t.assignedTime = document.getElementById('editAssignedTime').value;
            t.dueDate = document.getElementById('editDueDate').value;
            await saveTaskOne(t.id);
            refresh();
            closeModal();
            showToast('已保存');
        }

        function openSettings() { document.getElementById('settingsModal').classList.add('active'); }
        function closeSettings() { document.getElementById('settingsModal').classList.remove('active'); }

        // ---------- 完成检测（网页提醒） ----------
        function detectNewCompletions() {
            tasks.forEach(t => {
                if (t.done && t.completedAt && !knownDone[t.id]) {
                    if (knownDone._inited) {
                        showCompleteAlert(t);
                    }
                    knownDone[t.id] = t.completedAt;
                }
                if (!t.done) delete knownDone[t.id];
            });
            knownDone._inited = true;
        }

        function showCompleteAlert(t) {
            // 提醒音
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.value = 880;
                osc.type = 'sine';
                gain.gain.value = 0.3;
                osc.start();
                setTimeout(() => { osc.frequency.value = 1100; }, 200);
                setTimeout(() => { osc.stop(); ctx.close(); }, 600);
            } catch(e) {}

            // 浏览器通知
            if (Notification.permission === 'granted') {
                new Notification('任务完成通知', {
                    body: `${t.assignee} 完成了：${t.taskDesc}`,
                    tag: 'task-done',
                    requireInteraction: true
                });
            }

            // 页面内醒目弹窗
            const overlay = document.createElement('div');
            overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:3000;display:flex;justify-content:center;align-items:center;';
            overlay.innerHTML = `
                <div style="background:#fff;padding:40px;border-radius:16px;text-align:center;max-width:400px;box-shadow:0 8px 40px rgba(0,0,0,0.3);">
                    <div style="font-size:48px;margin-bottom:12px;">✅</div>
                    <h2 style="color:#2ecc71;margin-bottom:10px;">任务已完成！</h2>
                    <p style="font-size:16px;color:#555;margin-bottom:6px;"><strong>${esc(t.assignee)}</strong> 完成了：</p>
                    <p style="font-size:15px;color:#333;background:#f8f9fa;padding:12px;border-radius:8px;margin-bottom:20px;">${esc(t.taskDesc)}</p>
                    <p style="color:#999;font-size:13px;margin-bottom:20px;">完成时间: ${fmt(t.completedAt)}</p>
                    <button onclick="this.closest('div').parentElement.remove()" style="padding:10px 40px;background:#2ecc71;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;">知道了</button>
                </div>`;
            document.body.appendChild(overlay);
        }

        // ---------- 到期提醒 ----------
        let notifiedDue = {};

        function checkDueReminders() {
            const now = new Date();
            tasks.forEach(t => {
                if (t.done || !t.dueDate) return;
                const due = new Date(t.dueDate);
                const diff = due - now;
                const key = t.id + '_' + (t.dueDate || '');

                // 已逾期（每小时最多提醒一次）
                if (diff <= 0) {
                    const lastNotified = notifiedDue[key + '_overdue'];
                    if (!lastNotified || now - lastNotified > 3600000) {
                        notifiedDue[key + '_overdue'] = now;
                        sendDueNotification(t, 'overdue');
                    }
                }
                // 24小时内到期（只提醒一次）
                else if (diff <= 86400000) {
                    if (!notifiedDue[key + '_soon']) {
                        notifiedDue[key + '_soon'] = now;
                        sendDueNotification(t, 'soon');
                    }
                }
            });
        }

        function sendDueNotification(t, type) {
            const isOverdue = type === 'overdue';
            const title = isOverdue ? '任务已逾期！' : '任务即将到期！';
            const text = `${t.assignee} 的任务：${t.taskDesc}（Due: ${fmt(t.dueDate)}）`;

            // 浏览器通知
            if (Notification.permission === 'granted') {
                new Notification(title, {
                    body: text,
                    tag: 'due-' + t.id,
                    requireInteraction: isOverdue
                });
            }

            // ntfy 手机推播
            fetch('https://ntfy.sh/kepong-tasks', {
                method: 'POST',
                headers: { 'Title': title, 'Priority': isOverdue ? 'max' : 'high' },
                body: text
            }).catch(() => {});

            // 页面提示
            showToast(`⏰ ${title} ${esc(t.taskDesc)}`);
        }

        // ---------- 事件 ----------
        document.getElementById('taskForm').addEventListener('submit', addTask);
        document.getElementById('editForm').addEventListener('submit', saveEdit);
        document.getElementById('searchInput').addEventListener('input', renderTasks);
        document.getElementById('filterStatus').addEventListener('change', renderTasks);
        document.getElementById('filterAssignee').addEventListener('change', renderTasks);
        document.getElementById('toggleDoneBtn').addEventListener('click', function () {
            showCompleted = !showCompleted;
            this.textContent = showCompleted ? '隐藏已完成' : '显示已完成';
            renderTasks();
        });
        document.getElementById('editModal').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });
        document.getElementById('settingsModal').addEventListener('click', e => { if (e.target === e.currentTarget) closeSettings(); });

        // 输入名字自动带出电话
        document.getElementById('assignee').addEventListener('change', function() {
            const phone = lookupPhone(this.value.trim());
            if (phone) document.getElementById('assigneePhone').value = phone;
        });
        document.getElementById('assigneePhone').addEventListener('change', function() {
            rememberPhone(document.getElementById('assignee').value.trim(), this.value.trim());
        });
        document.getElementById('editAssignee').addEventListener('change', function() {
            const phone = lookupPhone(this.value.trim());
            if (phone) document.getElementById('editPhone').value = phone;
        });
        document.getElementById('editPhone').addEventListener('change', function() {
            rememberPhone(document.getElementById('editAssignee').value.trim(), this.value.trim());
        });

        // 设置按钮放到页面（动态加）
        (function addSettingsBtn() {
            const b = document.createElement('button');
            b.className = 'btn btn-sm';
            b.style.cssText = 'background:#333;color:#fff;margin-bottom:16px;';
            b.textContent = '⚙️ 设置（我的电话）';
            b.onclick = openSettings;
            document.querySelector('.sync-bar').after(b);
        })();

        if ('Notification' in window && Notification.permission === 'default') {
            Notification.requestPermission();
        }

        // ---------- PWA ----------
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }

        // ---------- 启动 ----------
        (async () => {
            await loadTasks();
            await loadSettings();
            await loadPhonebook();
            refresh();
            detectNewCompletions();
            setInterval(async () => {
                await loadTasks();
                refresh();
                detectNewCompletions();
                checkDueReminders();
            }, 8000);
        })();
    </script>
</body>
</html>
